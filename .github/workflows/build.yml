name: Build

on:
  push:
    branches: ['26.*', '1.*', main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 builds the mod (last entry = default); 8 is only needed by the Forge toolchain
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew :core:test -Paio.coreOnly=true
      - name: Build mod (all versions)
        env:
          AIO_STATS_URL: ${{ secrets.AIO_STATS_URL }}
        # --continue: one adapter that fails to build must not block the jars of the others
        run: ./gradlew build --continue -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 || echo "::warning::At least one adapter failed to build"
      # Collect the jars of all adapters (fabric-*, neoforge-*, forge-* that have a build.gradle)
      - name: Collect jars
        run: |
          mkdir -p dist
          find . -path '*/build/libs/aio-clientside-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} dist/ \;
          ls -la dist
          # The Fabric jar is the minimum: without it the build counts as failed
          ls dist/aio-clientside-fabric-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: aio-clientside
          path: dist/*.jar

      # Publish the jar itself as a release asset (no zip): one release per version, e.g. v0.2.2-mc26.3
      - name: Release with jar
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/26.') || startsWith(github.ref, 'refs/heads/1.'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          TAG="v$VER-mc$MC"
          BETA=""; case "$VER" in 0.*) BETA=" (beta)";; esac
          # Only the newest Minecraft version is marked "Latest" (change this when a newer version becomes the main one)
          LATEST_MC="26.3"
          if [ "$MC" = "$LATEST_MC" ]; then LATEST="--latest"; else LATEST="--latest=false"; fi
          # A published release is never changed: a new build needs a new mod_version (e.g. 0.4.3 -> 0.4.4)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists and stays unchanged. Raise mod_version for a new release."
            exit 0
          fi
          # Release notes: the section of this version from docs/CHANGELOG.md
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{f=0} f' docs/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $VER" > notes.md
          gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" $LATEST \
            --title "AIO ClientSide $VER$BETA (Minecraft $MC)" --notes-file notes.md
