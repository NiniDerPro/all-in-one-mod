name: Build

on:
  push:
    branches: ['26.*', main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Kern testen
        run: ./gradlew :core:test -Paio.coreOnly=true
      - name: Mod bauen (alle Versionen)
        env:
          AIO_STATS_URL: ${{ secrets.AIO_STATS_URL }}
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: aio-clientside
          path: fabric-*/build/libs/*.jar

      # Jar direkt als Release-Datei (keine ZIP): ein Release pro Version, z. B. v0.2.2-mc26.3
      - name: Release mit Jar
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/26.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          TAG="v$VER-mc$MC"
          PRE=""; case "$VER" in 0.*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" fabric-*/build/libs/*.jar --clobber
          else
            gh release create "$TAG" fabric-*/build/libs/*.jar --target "$GITHUB_SHA" \
              --title "AIO ClientSide $VER (Minecraft $MC)" --notes "Build $VER" $PRE
          fi
