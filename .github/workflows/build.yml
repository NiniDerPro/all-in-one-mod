name: Build

on:
  push:
    branches: ['26.*', main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew :core:test -Paio.coreOnly=true
      - name: Build mod (all versions)
        env:
          AIO_STATS_URL: ${{ secrets.AIO_STATS_URL }}
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: aio-clientside
          path: fabric-*/build/libs/*.jar

      # Publish the jar itself as a release asset (no zip): one release per version, e.g. v0.2.2-mc26.3
      - name: Release with jar
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/26.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          TAG="v$VER-mc$MC"
          BETA=""; case "$VER" in 0.*) BETA=" (beta)";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" fabric-*/build/libs/*.jar --clobber
            gh release edit "$TAG" --latest --prerelease=false --title "AIO ClientSide $VER$BETA (Minecraft $MC)"
          else
            gh release create "$TAG" fabric-*/build/libs/*.jar --target "$GITHUB_SHA" --latest \
              --title "AIO ClientSide $VER$BETA (Minecraft $MC)" --notes "Build $VER"
          fi
