plugins {
    id 'fabric-loom'
}

// Adapter für Minecraft 1.21.1. Für eine weitere Version diesen Ordner kopieren,
// Versionen in gradle.properties ergänzen und nur die Adapter-Klassen/Mixins anpassen.
evaluationDependsOn(':core')

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = 'aio-client'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Der Kern wird direkt ins Mod-Jar gepackt.
jar {
    from(project(':core').sourceSets.main.output)
}
