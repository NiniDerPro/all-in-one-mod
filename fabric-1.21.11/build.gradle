plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

// Adapter for Minecraft 1.21.11 (obfuscated game: official Mojang mappings, remapped jar).
// For another version copy this folder, add the versions and only adapt the
// adapter classes/mixins. The core stays unchanged.
evaluationDependsOn(':core')

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = 'aio-clientside-fabric'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

// The core is packed directly into the mod jar.
jar {
    from(project(':core').sourceSets.main.output)
}

// The stats server address only comes from the environment (CI secret), not from the source code
processResources {
    def statsUrl = System.getenv('AIO_STATS_URL') ?: ''
    inputs.property('statsUrl', statsUrl)
    doLast {
        new File(destinationDir, 'aio_stats_url.txt').text = statsUrl
    }
}
