org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

mod_version=0.4.5
maven_group=dev.aio

# Versions for the 26.3 adapter (as in fabric-example-mod). Current: https://fabricmc.net/develop
minecraft_version=26.3
# Build against the oldest known 26.3 loader version so that no newer loader APIs are used.
loader_version=0.19.5
fabric_api_version=0.165.0+26.3
loom_version=1.19-SNAPSHOT

# Forge adapter for 26.3
forge_version=26.3-66.1.5

# Forge dev runs: classes and resources of the mod in one folder
net.minecraftforge.gradle.merge-source-sets=true

# NeoForge adapter for 26.3
neoforge_version=26.3.0.102
