org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

mod_version=0.4.7
maven_group=dev.aio

# Versions for the 26.1 adapter (as in fabric-example-mod). Current: https://fabricmc.net/develop
minecraft_version=26.1
# Build against the oldest known 26.3 loader version so that no newer loader APIs are used.
loader_version=0.19.5
fabric_api_version=0.145.1+26.1
loom_version=1.19-SNAPSHOT

# Forge and NeoForge adapters
forge_version=26.1.2-64.1.6
neoforge_version=26.1.2.126
# Forge dev runs: classes and resources of the mod in one folder
net.minecraftforge.gradle.merge-source-sets=true
