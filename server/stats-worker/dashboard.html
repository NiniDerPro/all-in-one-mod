<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AIO stats</title>
<style>
:root{--bg:#0e1015;--card:#171a22;--line:#262b38;--t:#e8eaf0;--d:#8b93a7;--a:#7c5cff;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;padding:16px;max-width:1100px}
h1{font-size:20px;margin:0 0 14px}h2{font-size:12px;color:var(--d);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.big{font-size:30px;font-weight:700}.sub{color:var(--d);font-size:12px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:12px}
.row{display:flex;justify-content:space-between;gap:8px;margin:3px 0;position:relative;border-radius:4px;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;background:var(--a);opacity:.25}
.row span{position:relative;padding:3px 6px}.row .n{color:var(--d)}
input,button{background:var(--card);color:var(--t);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
button{cursor:pointer;border-color:var(--a)}#err{color:#ff6b6b;margin-left:8px}.live{color:var(--ok)}
</style></head><body>
<h1>AIO ClientSide stats</h1>
<div id="login"><input id="tok" type="password" placeholder="Admin token" autocomplete="off"><button id="go">Open</button><span id="err"></span></div>
<div id="app" hidden>
<div class="grid" id="cards"></div>
<div class="cols" id="cols"></div>
<p class="sub" id="foot"></p>
</div>
<script>
var tok=sessionStorage.getItem("aio_tok")||"",timer=null;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function card(box,title,big,sub){var c=el("div","card");c.appendChild(el("h2","",title));c.appendChild(el("div","big",String(big)));if(sub)c.appendChild(el("div","sub",sub));box.appendChild(c)}
function list(box,title,rows,hint){
  var c=el("div","card");c.appendChild(el("h2","",title));
  if(!rows.length){c.appendChild(el("div","sub","no data yet"))}
  var max=1;rows.forEach(function(r){if(r.v>max)max=r.v});
  rows.forEach(function(r){var row=el("div","row");var b=el("div","bar");b.style.width=Math.round(r.v/max*100)+"%";row.appendChild(b);row.appendChild(el("span","",r.k));row.appendChild(el("span","n",r.t||String(r.v)));c.appendChild(row)});
  if(hint)c.appendChild(el("div","sub",hint));box.appendChild(c)}
function render(d){
  var cards=document.getElementById("cards"),cols=document.getElementById("cols");cards.textContent="";cols.textContent="";
  var i=d.installs;
  card(cards,"Live now",i.live,"pinged in the last 15 min");card(cards,"Active 24 h",i.active24h);card(cards,"Active 7 days",i.active7d);card(cards,"Active 30 days",i.active30d);card(cards,"All installs",i.total);
  card(cards,"Avg FPS",d.performance&&d.performance.avgFps||0,"lowest session min: "+(d.performance&&d.performance.minFps||0));
  card(cards,"Modules on (avg peak)",d.peakActive&&d.peakActive.avg||0,"max "+(d.peakActive&&d.peakActive.max||0));
  var tot=Math.max(1,i.total);
  list(cols,"Modules switched on",d.modulesActive.map(function(m){return{k:m.module_id,v:m.active,t:m.active+" ("+Math.round(m.active/tot*100)+"%)"}}));
  var use={};d.modulesUsage.forEach(function(m){(use[m.module_id]=use[m.module_id]||[]).push(m.hours+": "+m.n)});
  list(cols,"Time in use per module (hours: installs)",Object.keys(use).map(function(k){return{k:k,v:use[k].length,t:use[k].join("  ")}}));
  list(cols,"Versions (mod / Minecraft)",d.versions.map(function(v){return{k:v.mod_version+" / "+v.mc_version,v:v.n}}));
  list(cols,"Java",d.java.map(function(v){return{k:String(v.java),v:v.n}}));
  list(cols,"Operating system",d.os.map(function(v){return{k:String(v.os),v:v.n}}));
  var kinds={deferred:"Module off, other mod wins",brokenHook:"Module disabled (hook failed)",missingMixin:"Mixin missing"};
  ["deferred","brokenHook","missingMixin"].forEach(function(k){
    list(cols,kinds[k],d.compat.filter(function(x){return x.kind===k}).map(function(x){return{k:x.name+(x.detail?" -> "+x.detail:""),v:x.n}}))});
  document.getElementById("foot").textContent="Updated "+new Date().toLocaleTimeString()+" - refreshes every 30 s";
}
function load(){
  fetch("/v1/stats",{headers:{authorization:"Bearer "+tok}}).then(function(r){
    if(!r.ok)throw 0;return r.json()}).then(function(d){
    document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;render(d);
    sessionStorage.setItem("aio_tok",tok);if(!timer)timer=setInterval(load,30000)
  }).catch(function(){
    sessionStorage.removeItem("aio_tok");document.getElementById("app").hidden=true;document.getElementById("login").hidden=false;
    document.getElementById("err").textContent="Wrong token or no connection"})
}
document.getElementById("go").onclick=function(){tok=document.getElementById("tok").value.trim();load()};
document.getElementById("tok").onkeydown=function(e){if(e.key==="Enter")document.getElementById("go").onclick()};
if(tok)load();
</script></body></html>
