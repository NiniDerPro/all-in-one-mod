pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo1.maven.org/maven2/' }
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
    }
}

rootProject.name = 'all-in-one-mod'

// Version-independent core: event bus, config, modules, HUD, GUI logic.
include 'core'

// Thin adapter layers per Minecraft version.
// With -Paio.coreOnly=true only the core is built/tested (without the Fabric Maven).
if (!Boolean.parseBoolean(providers.gradleProperty('aio.coreOnly').getOrElse('false'))) {
    include 'fabric-26.3'
}
