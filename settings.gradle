pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        maven { url = 'https://repo1.maven.org/maven2/' }
    }
    plugins {
        id 'fabric-loom' version "${loom_version}"
    }
}

rootProject.name = 'all-in-one-mod'

// Versionsunabhängiger Kern: Event-Bus, Config, Module, HUD, GUI-Logik.
include 'core'

// Dünne Adapter-Schichten pro Minecraft-Version.
// Mit -Paio.coreOnly=true lässt sich nur der Kern bauen/testen (ohne Fabric-Maven).
if (!Boolean.parseBoolean(providers.gradleProperty('aio.coreOnly').getOrElse('false'))) {
    include 'fabric-1.21.1'
}
